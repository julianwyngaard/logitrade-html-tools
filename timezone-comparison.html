<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone Comparison - tools.julianwyngaard.dev</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #0055aa;
            --ink: #1f2733;
            --muted: #6b7686;
            --line: #e6e9ee;
            --label-w: 190px;
            --work-bg: #e2f2e6;
            --work-ink: #2b7a45;
            --doable-bg: #fbeacf;
            --doable-ink: #9a6416;
            --night-bg: #eef1f5;
            --night-ink: #97a1b0;
            --good: #2e9e57;
            --sel-bg: #e1efff;
            --now: #e8590c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
            line-height: 1.6;
            color: var(--ink);
        }
        h1 { margin-bottom: 0.25rem; font-size: 1.9rem; letter-spacing: -0.02em; }
        .lede { color: var(--muted); margin-top: 0; }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem 1.25rem;
            margin: 1rem 0;
            padding: 0.9rem 1rem;
            background: #f7f8fa;
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        .field { display: flex; flex-direction: column; gap: 0.3rem; }
        .field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        input[type="date"], input[type="text"], select {
            padding: 0.5rem 0.6rem;
            font-size: 0.95rem;
            border: 1px solid #ccd2da;
            border-radius: 7px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.12);
        }
        .work-hours { display: flex; align-items: center; gap: 0.4rem; }
        .work-hours span { color: var(--muted); font-size: 0.85rem; }

        .search-wrap { position: relative; flex: 1; min-width: 220px; }
        .search-wrap input { width: 100%; }
        .suggestions {
            list-style: none;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
            margin-top: 4px;
            background: #fff;
            border: 1px solid #ccd2da;
            border-radius: 8px;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(20,30,50,0.14);
        }
        .suggestions:empty { display: none; }
        .suggestions li {
            padding: 0.5rem 0.7rem;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .suggestions li + li { border-top: 1px solid #f2f4f7; }
        .suggestions li:hover, .suggestions li.active { background: #eef6ff; }
        .suggestions li .sub {
            color: var(--muted);
            font-size: 0.72rem;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
        button {
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            cursor: pointer;
            border: 1px solid #ccd2da;
            border-radius: 7px;
            background: #fff;
            color: var(--ink);
            transition: background 0.12s, border-color 0.12s;
        }
        button:hover { background: #f0f2f5; }
        button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        button.primary:hover { background: var(--primary-dark); }

        .selected-banner {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.15rem 0.6rem;
            margin: 0.75rem 0 1rem;
            padding: 0.7rem 1rem;
            background: linear-gradient(180deg, #f0f7ff, #e8f2ff);
            border: 1px solid #cfe3fb;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #0a4a8f;
        }
        .selected-banner .big {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
        }
        .selected-banner .where { color: #37618c; }

        .planner-scroll {
            overflow-x: auto;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }
        .planner-grid {
            display: grid;
            /* grid-template-columns and min-width are set inline: a local day is
               23, 24 or 25 hours long depending on daylight saving, so the column
               count cannot be hard-coded here. */
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }

        /* The label column stays put while the hour strip scrolls sideways.
           Note: .planner-grid must NOT have overflow:hidden, or it becomes the
           scrollport and sticky silently stops working. */
        .corner, .row-label {
            position: sticky;
            left: 0;
            z-index: 2;
        }

        .corner {
            border-right: 2px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: #fbfcfd;
            border-top-left-radius: 9px;
            display: flex;
            align-items: center;
            padding: 0 0.7rem;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .overlap-cell {
            border-bottom: 1px solid var(--line);
            border-right: 1px solid #f3f5f7;
            cursor: pointer;
            height: 16px;
        }
        .overlap-cell.good { background: var(--good); }
        .overlap-cell.sel { box-shadow: inset 1px 0 0 var(--primary), inset -1px 0 0 var(--primary); }
        .overlap-cell.daybreak { border-left: 1px solid #d8dde4; }
        .overlap-cell.last-col { border-top-right-radius: 9px; border-right: none; }
        .overlap-cell:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }
        .cell.now-col, .overlap-cell.now-col { border-left: 2px solid var(--now); }

        .row-label {
            /* No `position: relative` here — it would override the sticky rule
               above. Sticky is also a positioned ancestor, so the absolutely
               positioned remove button still anchors to this element. */
            padding: 0.55rem 0.7rem;
            border-right: 2px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: #fbfcfd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.05rem;
        }
        /* Tagged in JS: `:last-of-type` matched on tag name, so it never
           selected the final .row-label (every grid child is a div). */
        .planner-grid > .row-label.last-row,
        .planner-grid > .cell.last-row { border-bottom: none; }
        .row-label.last-row { border-bottom-left-radius: 9px; }
        .cell.last-cell { border-bottom-right-radius: 9px; }
        .row-label .city {
            font-weight: 650;
            font-size: 0.92rem;
            line-height: 1.25;
            padding-right: 1.1rem;
        }
        .row-label .now {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }
        .row-label .daterow {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .row-label .offset {
            display: inline-block;
            padding: 0.05rem 0.4rem;
            border-radius: 999px;
            background: #eef1f5;
            color: #5a6474;
            font-size: 0.68rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            margin-top: 0.15rem;
            width: fit-content;
        }
        .row-label .daychip {
            padding: 0.02rem 0.35rem;
            border-radius: 999px;
            font-size: 0.66rem;
            font-weight: 700;
            background: #fff2e0;
            color: #b25e00;
        }
        .row-label .remove {
            position: absolute;
            top: 0.35rem;
            right: 0.4rem;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 5px;
            border: none;
            background: transparent;
            color: #b6bdc7;
            font-size: 0.95rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.12s, background 0.12s, color 0.12s;
        }
        .row-label:hover .remove,
        .row-label:focus-within .remove,
        .row-label .remove:focus-visible { opacity: 1; }
        .row-label .remove:hover { background: #fdecee; color: #c0392b; }
        .row-label .remove:focus-visible { outline: 2px solid var(--primary); }
        /* Touch devices have no hover, so the control must always be visible —
           otherwise zones can never be removed on a phone. */
        @media (hover: none) {
            .row-label .remove { opacity: 1; color: #8a929e; }
        }

        .cell {
            border-bottom: 1px solid var(--line);
            border-right: 1px solid #f3f5f7;
            text-align: center;
            font-size: 0.7rem;
            padding: 0.6rem 0;
            cursor: pointer;
            color: #7a828f;
            font-variant-numeric: tabular-nums;
            user-select: none;
            transition: background 0.1s;

        .cell.work { background: var(--work-bg); color: var(--work-ink); font-weight: 600; }
        .cell.night { background: var(--night-bg); color: var(--night-ink); }
        .cell.daybreak { border-left: 1px solid #d8dde4; }
        .cell.hover:not(.sel) { background: rgba(0,102,204,0.07); }
        .cell.half { font-size: 0.62rem; }
        .cell .abbr {
            display: block;
            font-size: 0.5rem;
            line-height: 1;
            letter-spacing: 0.02em;
            opacity: 0.8;
            font-weight: 600;
        }
        .cell.ambiguous { position: relative; padding: 0.35rem 0; }
        .cell.sel {
            background: var(--sel-bg);
            color: var(--primary);
            font-weight: 700;
            box-shadow: inset 1px 0 0 var(--primary), inset -1px 0 0 var(--primary);
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.1rem;
            margin: 0.85rem 0;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
        .swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.08); }
        .swatch.work { background: var(--work-bg); }
        .swatch.doable { background: var(--doable-bg); }
        .swatch.night { background: var(--night-bg); }
        .swatch.good { background: var(--good); border-color: var(--good); }
        .swatch.sel { background: var(--sel-bg); box-shadow: inset 0 0 0 1.5px var(--primary); }
        .swatch.now { background: #fff; border-left: 3px solid var(--now); border-radius: 0; width: 8px; }

        .no-overlap {
            margin: 0.6rem 0 0;
            padding: 0.5rem 0.75rem;
            border-radius: 7px;
            background: #fdf3e3;
            color: #8a5a12;
            font-size: 0.85rem;
        }
        .empty-hint {
            color: var(--muted);
            padding: 1.5rem 1rem;
            text-align: center;
            border: 1px dashed #d3d8df;
            border-radius: 10px;
            background: #fbfcfd;
        }

        .status { margin-top: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 7px; font-size: 0.9rem; }
        .status.success { background: #e5f6ea; color: #1f7a3d; }
        .status.error { background: #fdecec; color: #c0392b; }
        .status.info { background: #eaf3ff; color: #0a4a8f; }
        .status:empty { display: none; }

        footer {
            margin-top: 2.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.88rem;
        }
        footer a { color: var(--primary); }

        @media (max-width: 600px) {
            :root { --label-w: 148px; }
            h1 { font-size: 1.55rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .search-wrap { min-width: 0; }
            .row-label .now { font-size: 1.15rem; }
        }
    </style>

    <script>
        // ---- Time zone conversion (pure, DST-aware via Intl) ----

        function localPartsAt(instant, timeZone) {
            const dtf = new Intl.DateTimeFormat('en-US', {
                timeZone,
                hourCycle: 'h23',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                weekday: 'short',
            });
            const parts = {};
            for (const p of dtf.formatToParts(instant)) parts[p.type] = p.value;
            return {
                year: +parts.year, month: +parts.month, day: +parts.day,
                hour: +parts.hour, minute: +parts.minute, second: +parts.second,
                weekday: parts.weekday,
            };
        }

        function getOffsetMinutes(instant, timeZone) {
            const p = localPartsAt(instant, timeZone);
            const asUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
            return Math.round((asUTC - instant.getTime()) / 60000);
        }

        function zonedTimeToInstant(timeZone, year, month, day, hour, minute) {
            const guess = Date.UTC(year, month - 1, day, hour, minute, 0);
            const offset = getOffsetMinutes(new Date(guess), timeZone);
            let instant = guess - offset * 60000;
            const offset2 = getOffsetMinutes(new Date(instant), timeZone);
            if (offset2 !== offset) instant = guess - offset2 * 60000;
            return new Date(instant);
        }

        // Short zone name (EST, BST, GMT+8) — used to tell apart the repeated
        // hour when clocks go back and the same local time happens twice.
        function zoneAbbr(instant, timeZone) {
            try {
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone, hour: 'numeric', timeZoneName: 'short',
                }).formatToParts(instant);
                const found = parts.find(p => p.type === 'timeZoneName');
                return found ? found.value : '';
            } catch (e) {
                return '';
            }
        }

        // First instant that actually falls on the given local date. Normally
        // this is local midnight, but where DST springs forward at 00:00
        // (Santiago, Beirut, Cuba) midnight does not exist, so step forward to
        // the first hour that does.
        function dayStartInstant(timeZone, year, month, day) {
            let t = zonedTimeToInstant(timeZone, year, month, day, 0, 0).getTime();
            const target = Date.UTC(year, month - 1, day) / 86400000;
            for (let i = 0; i < 6; i++) {
                if (dayNumber(localPartsAt(new Date(t), timeZone)) >= target) break;
                t += 3600000;
            }
            return t;
        }

        // ---- Formatting helpers ----

        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        function fmtOffset(min) {
            if (min === 0) return 'UTC';
            const sign = min < 0 ? '-' : '+';
            const abs = Math.abs(min);
            const h = Math.floor(abs / 60);
            const m = abs % 60;
            return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
        }

        function pad2(n) { return String(n).padStart(2, '0'); }
        function fmtTime(parts) { return pad2(parts.hour) + ':' + pad2(parts.minute); }
        function fmtDate(parts) { return parts.weekday + ' ' + parts.day + ' ' + MONTHS[parts.month - 1]; }
        function dayNumber(parts) { return Date.UTC(parts.year, parts.month - 1, parts.day) / 86400000; }

        function fillDaterow(el, nowParts, delta) {
            el.innerHTML = '';
            const dateText = document.createElement('span');
            dateText.textContent = fmtDate(nowParts);
            el.appendChild(dateText);
            if (delta !== 0) {
                const chip = document.createElement('span');
                chip.className = 'daychip';
                chip.textContent = (delta > 0 ? '+' : '−') + Math.abs(delta) + ' day' + (Math.abs(delta) > 1 ? 's' : '');
                el.appendChild(chip);
            }
        }

        function primaryLabel(zone) {
            const found = CITIES.find(c => c.zone === zone);
            if (found) return found.label;
            return zone.split('/').pop().replace(/_/g, ' ');
        }

        function cityLabel(zone) {
            return state.labels[zone] || primaryLabel(zone);
        }

            { label: 'Ho Chi Minh City, Vietnam', zone: 'Asia/Ho_Chi_Minh', kw: 'vietnam saigon hanoi' },
            { label: 'Singapore', zone: 'Asia/Singapore', kw: 'singapore' },
            { label: 'Hong Kong', zone: 'Asia/Hong_Kong', kw: 'hong kong china' },
            { label: 'Beijing, China', zone: 'Asia/Shanghai', kw: 'china shanghai shenzhen guangzhou' },
            { label: 'Kuala Lumpur, Malaysia', zone: 'Asia/Kuala_Lumpur', kw: 'malaysia' },
            { label: 'Manila, Philippines', zone: 'Asia/Manila', kw: 'philippines' },
            { label: 'Taipei, Taiwan', zone: 'Asia/Taipei', kw: 'taiwan' },
            { label: 'Perth, Australia', zone: 'Australia/Perth', kw: 'australia western' },
            { label: 'Tokyo, Japan', zone: 'Asia/Tokyo', kw: 'japan osaka kyoto' },
            { label: 'Seoul, South Korea', zone: 'Asia/Seoul', kw: 'south korea' },
            { label: 'Adelaide, Australia', zone: 'Australia/Adelaide', kw: 'australia' },
            { label: 'Darwin, Australia', zone: 'Australia/Darwin', kw: 'australia' },
            { label: 'Sydney, Australia', zone: 'Australia/Sydney', kw: 'australia melbourne canberra' },
            { label: 'Brisbane, Australia', zone: 'Australia/Brisbane', kw: 'australia queensland' },
            { label: 'Noumea, New Caledonia', zone: 'Pacific/Noumea', kw: 'new caledonia' },
            { label: 'Auckland, New Zealand', zone: 'Pacific/Auckland', kw: 'new zealand wellington nz' },
            { label: 'Fiji', zone: 'Pacific/Fiji', kw: 'fiji suva' },
            { label: 'UTC', zone: 'UTC', kw: 'utc gmt universal coordinated' },
        ];

        // ---- State ----

        const STORAGE_KEY = 'timezone-comparison-state';
        // Upper bound for a stored/shared column index. A day is at most 25
        // hours; the extra slack is clamped against the real count on render.
        const MAX_COLS = 26;

        // ICU reports 'Etc/Unknown' when the host time zone cannot be mapped to
        // an IANA name (e.g. TZ is set to a POSIX string like "NZST-12"). That
        // is a truthy string, so a plain `|| 'UTC'` fallback does not catch it
        // and every later conversion throws.
        function localZone() {
            let zone;
            try {
                zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            } catch (e) {
                return 'UTC';
            }
            if (!zone || zone === 'Etc/Unknown' || !isValidZone(zone)) return 'UTC';
            return zone;
        }

        function isValidDateStr(s) {
            if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
            const [y, m, d] = s.split('-').map(Number);
            // Reject values that silently roll over, e.g. 2026-13-45.
            const probe = new Date(Date.UTC(y, m - 1, d));
            return probe.getUTCFullYear() === y
                && probe.getUTCMonth() === m - 1
                && probe.getUTCDate() === d;
        }

        function todayLocalDate() {
            const p = localPartsAt(new Date(), localZone());
            return p.year + '-' + pad2(p.month) + '-' + pad2(p.day);
        }

        const state = {
            zones: [],
            labels: {},
            date: todayLocalDate(),
            selCol: 9,
            workStart: 9,
            workEnd: 17,
        };

        // Instants for each column of the current day, in the anchor zone.
        // Length is 23, 24 or 25 depending on daylight saving.
        let columns = [];

        // ---- Rendering ----

        function homeZone() { return state.zones[0]; }

        // One column per real hour between this local date's first instant and
        // the next day's. That is 23 hours on a spring-forward day and 25 on a
        // fall-back day — assuming a flat 24 dropped or duplicated an hour.
        function buildColumns() {
            const zone = homeZone();
            const [y, m, d] = state.date.split('-').map(Number);
            const start = dayStartInstant(zone, y, m, d);
            const nx = new Date(Date.UTC(y, m - 1, d + 1));
            const end = dayStartInstant(zone, nx.getUTCFullYear(), nx.getUTCMonth() + 1, nx.getUTCDate());
            const cols = [];
            for (let t = start; t < end && cols.length < 30; t += 3600000) cols.push(t);
            return cols.length ? cols : [start];
        }

        function instantForColumn(col) {
            const clamped = Math.min(Math.max(col, 0), columns.length - 1);
            return new Date(columns[clamped]);
        }

        // Fractional local hour, so zones offset by :30 or :45 (India, Nepal,
        // Adelaide, Chatham) are classified by their real local time.
        function hourValue(parts) { return parts.hour + parts.minute / 60; }

        function inWork(hv) {
            const s = state.workStart, e = state.workEnd;
            return s < e ? (hv >= s && hv < e) : (hv >= s || hv < e);
        }

        function hourClass(hv) {
            if (inWork(hv)) return 'work';
            if (hv >= 22 || hv < 6) return 'night';
            return 'day';
        }

        function nowColumn() {
            const now = Date.now();
            for (let i = 0; i < columns.length; i++) {
                if (now >= columns[i] && now < columns[i] + 3600000) return i;
            }
            return -1;
        }

        let hoverCol = -1;

        function highlightColumn(col) {
            const grid = document.querySelector('.planner-grid');
            if (!grid) return;
            if (hoverCol >= 0) {
                grid.querySelectorAll('.cell[data-col="' + hoverCol + '"]').forEach(c => c.classList.remove('hover'));
            }
            hoverCol = col;
            if (col >= 0) {
                grid.querySelectorAll('.cell[data-col="' + col + '"]').forEach(c => c.classList.add('hover'));
            }
        }

        function render() {
            const planner = document.getElementById('planner');
            planner.innerHTML = '';
            hoverCol = -1;

            if (state.zones.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No places yet — search above to add a city or country.';
                planner.appendChild(hint);
                renderBanner();
                return;
            }

            columns = buildColumns();
            state.selCol = Math.min(Math.max(state.selCol, 0), columns.length - 1);

            const selInstant = instantForColumn(state.selCol);
            const anchorDay = dayNumber(localPartsAt(selInstant, homeZone()));
            const nowCol = nowColumn();

            const grid = document.createElement('div');
            grid.className = 'planner-grid';
            grid.style.gridTemplateColumns =
                'var(--label-w) repeat(' + columns.length + ', minmax(32px, 1fr))';
            grid.style.minWidth = 'calc(var(--label-w) + ' + columns.length + ' * 32px)';

            // Local parts of each zone at each column, reused for shading + overlap.
            const zoneParts = state.zones.map(z =>
                columns.map(t => localPartsAt(new Date(t), z)));

            // Overlap summary row: a column is "good" when every zone is within working hours.
            const corner = document.createElement('div');
            corner.className = 'corner';
            corner.textContent = 'Overlap';
            grid.appendChild(corner);

            let overlapCount = 0;
            for (let col = 0; col < columns.length; col++) {
                const cell = document.createElement('div');
                cell.className = 'overlap-cell';
                const allWork = zoneParts.every(parts => inWork(hourValue(parts[col])));
                if (allWork) { cell.classList.add('good'); overlapCount++; }
                if (zoneParts[0][col].hour === 0) cell.classList.add('daybreak');
                if (col === state.selCol) cell.classList.add('sel');
                if (col === nowCol) cell.classList.add('now-col');
                if (col === columns.length - 1) cell.classList.add('last-col');
                cell.dataset.col = col;
                cell.setAttribute('role', 'button');
                cell.tabIndex = col === state.selCol ? 0 : -1;
                cell.setAttribute('aria-label', overlapLabel(col, allWork));
                cell.title = allWork ? 'Everyone is within working hours' : '';
                grid.appendChild(cell);
            }

            state.zones.forEach((zone, zi) => {
                const label = document.createElement('div');
                label.className = 'row-label';

                const city = document.createElement('div');
                city.className = 'city';
                city.textContent = cityLabel(zone);
                label.appendChild(city);

                const nowParts = localPartsAt(selInstant, zone);
                const now = document.createElement('div');
                now.className = 'now';
                now.textContent = fmtTime(nowParts);
                label.appendChild(now);

                const daterow = document.createElement('div');
                daterow.className = 'daterow';
                fillDaterow(daterow, nowParts, dayNumber(nowParts) - anchorDay);
                label.appendChild(daterow);

                const offset = document.createElement('div');
                offset.className = 'offset';
                offset.textContent = fmtOffset(getOffsetMinutes(selInstant, zone));
                label.appendChild(offset);

                const remove = document.createElement('button');
                remove.className = 'remove';
                remove.title = 'Remove ' + cityLabel(zone);
                remove.textContent = '×';
                remove.addEventListener('click', () => removeZone(zi));
                label.appendChild(remove);

                if (zi === state.zones.length - 1) label.classList.add('last-row');
                grid.appendChild(label);

                // A repeated local hour means clocks went back, so the same wall
                // time occurs twice; tag those cells with the zone abbreviation.
                const seenHours = {};
                zoneParts[zi].forEach(p => {
                    const key = p.hour + '@' + dayNumber(p);
                    seenHours[key] = (seenHours[key] || 0) + 1;
                });

                for (let col = 0; col < columns.length; col++) {
                    const p = zoneParts[zi][col];
                    const cell = document.createElement('div');
                    cell.className = 'cell ' + hourClass(hourValue(p));
                    if (p.hour === 0 && p.minute === 0) cell.classList.add('daybreak');
                    if (col === state.selCol) cell.classList.add('sel');
                    if (col === nowCol) cell.classList.add('now-col');
                    if (zi === state.zones.length - 1) cell.classList.add('last-row');
                    if (zi === state.zones.length - 1 && col === columns.length - 1) {
                        cell.classList.add('last-cell');
                    }

                    if (p.minute !== 0) cell.classList.add('half');
                    cell.textContent = p.minute !== 0
                        ? p.hour + ':' + pad2(p.minute)
                        : String(p.hour);

                    const abbr = zoneAbbr(new Date(columns[col]), zone);
                    if (seenHours[p.hour + '@' + dayNumber(p)] > 1 && abbr) {
                        cell.classList.add('ambiguous');
                        const tag = document.createElement('span');
                        tag.className = 'abbr';
                        // "GMT+10:30" would overflow a 32px cell; the offset
                        // alone still separates the two repeated hours.
                        tag.textContent = /^(GMT|UTC)/.test(abbr)
                            ? abbr.replace(/^(GMT|UTC)/, '') || '±0'
                            : abbr;
                        cell.appendChild(tag);
                    }

                    cell.title = fmtTime(p) + ' ' + fmtDate(p) +
                        (abbr ? ' ' + abbr : '') + ' — ' + cityLabel(zone);
                    cell.dataset.col = col;
                    grid.appendChild(cell);
                }
            });

            const scroll = document.createElement('div');
            scroll.className = 'planner-scroll';
            scroll.appendChild(grid);
            planner.appendChild(scroll);

            if (state.zones.length > 1 && overlapCount === 0) {
                const note = document.createElement('p');
                note.className = 'no-overlap';
                note.textContent = 'No hour works for everyone at ' + pad2(state.workStart) +
                    ':00–' + pad2(state.workEnd) + ':00. Widen the working hours, or pick an ' +
                    'amber slot where someone is at least awake.';
                planner.appendChild(note);
            }

            grid.addEventListener('click', e => {
                const target = e.target.closest('[data-col]');
                if (!target) return;
                selectColumn(Number(target.dataset.col));
            });
            grid.addEventListener('mouseover', e => {
                const target = e.target.closest('[data-col]');
                highlightColumn(target ? Number(target.dataset.col) : -1);
            });
            grid.addEventListener('mouseleave', () => highlightColumn(-1));

            // Roving tabindex on the overlap row: the whole point of the tool is
            // picking a column, so that has to work without a mouse.
            grid.addEventListener('keydown', e => {
                if (!e.target.closest('.overlap-cell')) return;
                let next;
                if (e.key === 'ArrowRight') next = state.selCol + 1;
                else if (e.key === 'ArrowLeft') next = state.selCol - 1;
                else if (e.key === 'Home') next = 0;
                else if (e.key === 'End') next = columns.length - 1;
                else return;
                e.preventDefault();
                selectColumn(Math.min(Math.max(next, 0), columns.length - 1));
                const moved = grid.querySelector('.overlap-cell[data-col="' + state.selCol + '"]');
                if (moved) moved.focus();
            });

            renderBanner();
        }

        function selectColumn(col) {
            state.selCol = col;
            persist();
            applySelection();
        }

        function overlapLabel(col, allWork) {
            const p = localPartsAt(new Date(columns[col]), homeZone());
            return fmtTime(p) + ' ' + fmtDate(p) +
                (allWork ? ' — everyone is within working hours' : '');
        }

        function renderBanner() {
            const banner = document.getElementById('selected-banner');
            if (state.zones.length === 0) { banner.textContent = ''; return; }
            const selInstant = instantForColumn(state.selCol);
            const home = homeZone();
            const p = localPartsAt(selInstant, home);
            // Only add a real abbreviation (EST, BST, IST) — "GMT+5:30" style
            // names just repeat the offset we already print.
            const abbr = zoneAbbr(selInstant, home);
            const useAbbr = abbr && !/^(GMT|UTC)([+-]|$)/.test(abbr);
            banner.innerHTML = 'Meeting at <span class="big">' + fmtTime(p) + '</span> ' +
                '<span class="where">' + fmtDate(p) + ' in ' + escapeHTML(cityLabel(home)) +
                ' (' + fmtOffset(getOffsetMinutes(selInstant, home)) +
                (useAbbr ? ', ' + escapeHTML(abbr) : '') + ')</span>';
        }

        // Update only what depends on the selected hour, in place, so picking a
        // slot never rebuilds the grid (no flicker).
        function applySelection() {
            const grid = document.querySelector('.planner-grid');
            if (!grid) { render(); return; }
            grid.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
            grid.querySelectorAll('[data-col="' + state.selCol + '"]').forEach(el => el.classList.add('sel'));
            grid.querySelectorAll('.overlap-cell').forEach(el => {
                el.tabIndex = Number(el.dataset.col) === state.selCol ? 0 : -1;
            });

            const selInstant = instantForColumn(state.selCol);
            const anchorDay = dayNumber(localPartsAt(selInstant, homeZone()));
            const labelEls = grid.querySelectorAll('.row-label');
            state.zones.forEach((zone, zi) => {
                const el = labelEls[zi];
                if (!el) return;
                const nowParts = localPartsAt(selInstant, zone);
                el.querySelector('.now').textContent = fmtTime(nowParts);
                fillDaterow(el.querySelector('.daterow'), nowParts, dayNumber(nowParts) - anchorDay);
                el.querySelector('.offset').textContent = fmtOffset(getOffsetMinutes(selInstant, zone));
            });
            renderBanner();
        }

        function escapeHTML(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        // ---- Zone management ----

        function addZone(zone, label) {
            if (state.zones.includes(zone)) {
                showStatus(cityLabel(zone) + ' shares this timezone and is already on the list', 'info');
                return;
            }
            state.zones.push(zone);
            if (label) state.labels[zone] = sanitizeLabel(label);
            persist();
            safeRender();
        }

        function removeZone(index) {
            const zone = state.zones[index];
            // Removing row 0 re-anchors the axis, so hold the chosen *instant*
            // rather than the column number — otherwise the meeting silently
            // moves to a different time.
            const keepInstant = columns.length ? columns[state.selCol] : null;
            state.zones.splice(index, 1);
            delete state.labels[zone];
            safeRender();
            if (keepInstant !== null && columns.length) {
                let best = 0;
                let bestDelta = Infinity;
                columns.forEach((t, i) => {
                    const delta = Math.abs(t - keepInstant);
                    if (delta < bestDelta) { bestDelta = delta; best = i; }
                });
                if (best !== state.selCol) {
                    state.selCol = best;
                    applySelection();
                }
            }
            persist();
        }

        // ---- Search ----

        function searchZones(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];

            // Rank name matches above keyword matches, then keep only the best
            // entry per zone — otherwise a query like "usa" fills every slot
            // with the six cities that all share America/Los_Angeles.
            const scored = [];
            CITIES.forEach((c, i) => {
                const label = c.label.toLowerCase();
                let score;
                if (label.startsWith(q)) score = 0;
                else if (label.includes(q)) score = 1;
                else if ((' ' + c.kw).includes(' ' + q)) score = 2;
                else if (c.kw.includes(q)) score = 3;
                else return;
                scored.push({ label: c.label, zone: c.zone, score, i });
            });
            scored.sort((a, b) => a.score - b.score || a.i - b.i);

            const results = [];
            const seen = new Set();
            for (const r of scored) {
                if (seen.has(r.zone)) continue;
                seen.add(r.zone);
                results.push({ label: r.label, zone: r.zone });
                if (results.length >= 8) break;
            }

            if (results.length < 8 && typeof Intl.supportedValuesOf === 'function') {
                for (const z of Intl.supportedValuesOf('timeZone')) {
                    if (seen.has(z)) continue;
                    if (z.toLowerCase().replace(/_/g, ' ').includes(q)) {
                        results.push({ label: z.replace(/_/g, ' '), zone: z });
                        seen.add(z);
                    }
                    if (results.length >= 8) break;
                }
            }
            return results;
        }

        let activeSuggestion = -1;

        function renderSuggestions(query) {
            const list = document.getElementById('suggestions');
            const results = searchZones(query);
            list.innerHTML = '';
            activeSuggestion = -1;
            results.forEach(r => {
                const li = document.createElement('li');
                const name = document.createElement('span');
                name.textContent = r.label;
                const sub = document.createElement('span');
                sub.className = 'sub';
                sub.textContent = r.zone;
                li.appendChild(name);
                li.appendChild(sub);
                li.addEventListener('mousedown', e => {
                    e.preventDefault();
                    pickSuggestion(r.zone, r.label);
                });
                list.appendChild(li);
            });
        }

        function pickSuggestion(zone, label) {
            addZone(zone, label);
            const input = document.getElementById('zone-search');
            input.value = '';
            document.getElementById('suggestions').innerHTML = '';
        }

        // ---- Persistence (URL for sharing + localStorage for your session) ----

        function persist() {
            const params = new URLSearchParams();
            params.set('zones', state.zones.join(','));
            // Carry the chosen names too, so a shared link shows "Portland"
            // rather than whichever city happens to head that zone's entry.
            params.set('names', state.zones.map(z => cityLabel(z)).join('|'));
            params.set('date', state.date);
            params.set('t', state.selCol);
            params.set('w', state.workStart + '-' + state.workEnd);
            window.history.replaceState({}, '', '?' + params.toString());
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    zones: state.zones,
                    labels: state.labels,
                    date: state.date,
                    selCol: state.selCol,
                    workStart: state.workStart,
                    workEnd: state.workEnd,
                }));
            } catch (e) { /* private mode or quota — sharing still works */ }
        }

        // Labels round-trip through the URL, so keep them short and inert.
        function sanitizeLabel(s) {
            return String(s).replace(/[<>]/g, '').trim().slice(0, 60);
        }

        function applyWorkWindow(w) {
            if (w && /^\d{1,2}-\d{1,2}$/.test(w)) {
                const [s, e] = w.split('-').map(Number);
                // s > e is allowed and means an overnight shift (e.g. 22-06).
                if (s >= 0 && s <= 23 && e >= 1 && e <= 24 && s !== e) {
                    state.workStart = s;
                    state.workEnd = e;
                }
            }
        }

        function applyZoneList(rawZones, rawNames) {
            const seen = new Set();
            state.zones = [];
            rawZones.forEach((z, i) => {
                if (!z || seen.has(z) || !isValidZone(z)) return;
                seen.add(z);
                state.zones.push(z);
                if (rawNames && rawNames[i]) state.labels[z] = sanitizeLabel(rawNames[i]);
            });
        }

        function applyQuery(query) {
            const params = new URLSearchParams(query);
            const zones = params.get('zones');
            if (zones === null) return false;
            applyZoneList(zones.split(','), (params.get('names') || '').split('|'));
            const date = params.get('date');
            if (isValidDateStr(date)) state.date = date;
            const t = parseInt(params.get('t'), 10);
            if (t >= 0 && t < MAX_COLS) state.selCol = t;
            applyWorkWindow(params.get('w'));
            return true;
        }

        function applyStored(raw) {
            let data;
            try { data = JSON.parse(raw); } catch (e) { return false; }
            if (!data || !Array.isArray(data.zones)) return false;
            state.labels = data.labels && typeof data.labels === 'object' ? data.labels : {};
            applyZoneList(data.zones, null);
            if (isValidDateStr(data.date)) state.date = data.date;
            const col = data.selCol !== undefined ? data.selCol : data.selHour;
            if (col >= 0 && col < MAX_COLS) state.selCol = col;
            applyWorkWindow(data.workStart + '-' + data.workEnd);
            return true;
        }

        function isValidZone(zone) {
            try {
                new Intl.DateTimeFormat('en-US', { timeZone: zone });
                return true;
            } catch (e) {
                return false;
            }
        }

        function loadState() {
            let stored = null;
            try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) { /* private mode */ }
            const fromUrl = window.location.search.length > 1 && applyQuery(window.location.search);

            if (fromUrl) {
                // Fall back to names from a previous session for any zone the
                // link did not name itself.
                if (stored) {
                    try {
                        const data = JSON.parse(stored);
                        if (data && data.labels) {
                            state.zones.forEach(z => {
                                if (!state.labels[z] && data.labels[z]) {
                                    state.labels[z] = sanitizeLabel(data.labels[z]);
                                }
                            });
                        }
                    } catch (e) { /* ignore malformed cache */ }
                }
            } else if (stored) {
                applyStored(stored);
            }

            if (state.zones.length === 0) {
                const defaults = [localZone(), 'America/New_York', 'Europe/London'];
                state.zones = defaults.filter((z, i) => defaults.indexOf(z) === i);
            }
        }

        // ---- Controls wiring ----

        function populateHourSelects() {
            const start = document.getElementById('work-start');
            const end = document.getElementById('work-end');
            // 24:00 is only meaningful as an end; 00:00 only as a start.
            for (let h = 0; h <= 23; h++) start.appendChild(new Option(pad2(h) + ':00', h));
            for (let h = 1; h <= 24; h++) end.appendChild(new Option(pad2(h) + ':00', h));
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            if (type !== 'error') {
                setTimeout(() => { status.textContent = ''; status.className = 'status'; }, 3000);
            }
        }

        function shareURL() {
            persist();
            const url = window.location.origin + window.location.pathname + window.location.search;
            navigator.clipboard.writeText(url).then(() => {
                showStatus('Share link copied to clipboard', 'success');
            }).catch(() => {
                showStatus('Link is in the address bar — copy it from there', 'info');
            });
        }

        function resetTool() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* private mode */ }
            state.zones = [localZone()];
            state.labels = {};
            state.date = todayLocalDate();
            state.workStart = 9;
            state.workEnd = 17;
            state.selCol = 9;
            document.getElementById('zone-search').value = '';
            document.getElementById('suggestions').innerHTML = '';
            syncControls();
            persist();
            safeRender();
            showStatus('Reset to your local timezone', 'info');
        }

        function syncControls() {
            document.getElementById('date').value = state.date;
            document.getElementById('work-start').value = state.workStart;
            document.getElementById('work-end').value = state.workEnd;
        }

        // A bad stored value must never take the whole tool down: without this,
        // one unparseable date throws mid-init and every listener below is
        // never attached, leaving controls that look fine but do nothing.
        function safeRender() {
            try {
                render();
            } catch (err) {
                const planner = document.getElementById('planner');
                planner.innerHTML = '';
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'Could not draw the planner for these settings. Press Reset to start again.';
                planner.appendChild(hint);
                showStatus('Something went wrong: ' + err.message, 'error');
            }
        }

        function init() {
            populateHourSelects();
            loadState();
            syncControls();
            safeRender();

            document.getElementById('date').addEventListener('change', e => {
                state.date = isValidDateStr(e.target.value) ? e.target.value : todayLocalDate();
                syncControls();
                persist();
                safeRender();
            });

            document.getElementById('work-start').addEventListener('change', e => {
                const v = Number(e.target.value);
                // s > e is a legitimate overnight window (22:00–06:00).
                if (v !== state.workEnd) { state.workStart = v; persist(); safeRender(); }
                else { e.target.value = state.workStart; }
            });

            document.getElementById('work-end').addEventListener('change', e => {
                const v = Number(e.target.value);
                if (v !== state.workStart) { state.workEnd = v; persist(); safeRender(); }
                else { e.target.value = state.workEnd; }
            });

            const search = document.getElementById('zone-search');
            search.addEventListener('input', e => renderSuggestions(e.target.value));
            search.addEventListener('keydown', e => {
                const list = document.getElementById('suggestions');
                const items = Array.from(list.children);
                if (e.key === 'ArrowDown' && items.length) {
                    e.preventDefault();
                    activeSuggestion = Math.min(activeSuggestion + 1, items.length - 1);
                } else if (e.key === 'ArrowUp' && items.length) {
                    e.preventDefault();
                    activeSuggestion = Math.max(activeSuggestion - 1, 0);
                } else if (e.key === 'Enter') {
                    const results = searchZones(e.target.value);
                    const pick = results[activeSuggestion >= 0 ? activeSuggestion : 0];
                    if (pick) pickSuggestion(pick.zone, pick.label);
                    return;
                } else if (e.key === 'Escape') {
                    list.innerHTML = '';
                    return;
                } else {
                    return;
                }
                items.forEach((li, i) => li.classList.toggle('active', i === activeSuggestion));
            });
            search.addEventListener('blur', () => {
                setTimeout(() => { document.getElementById('suggestions').innerHTML = ''; }, 150);
            });

            // Keep the "right now" marker on the correct column as time passes.
            setInterval(() => {
                const grid = document.querySelector('.planner-grid');
                if (!grid) return;
                const col = nowColumn();
                grid.querySelectorAll('.now-col').forEach(el => el.classList.remove('now-col'));
                if (col >= 0) {
                    grid.querySelectorAll('[data-col="' + col + '"]').forEach(el => el.classList.add('now-col'));
                }
            }, 60000);
        }

        init();
    </script>
</body>
</html>
