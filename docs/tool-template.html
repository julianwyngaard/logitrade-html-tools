<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Tool Name] - tools.julianwyngaard.dev</title>
    <!-- This template lives in docs/, so it reaches the stylesheet with ../.
         A tool at the repo root uses href="tools.css". -->
    <link rel="stylesheet" href="../tools.css">
    <style>
        /* Tool-specific styles.
           Scope everything under a tool-specific class or id, use var(--…)
           tokens for colour, radius and borders, and never redefine the base
           tokens or restyle base elements. */
        .tool-output {
            min-height: 4rem;
            font-family: var(--mono);
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; All Tools</a>
    <h1>[Tool Name]</h1>
    <p class="lede">[One sentence telling the user what to do with this tool.]</p>

    <div class="buttons">
        <button id="run" class="primary">[Primary action]</button>
        <button id="share">Share URL</button>
        <button id="clear">Clear</button>
    </div>

    <main>
        <div class="field">
            <label for="input">Input</label>
            <textarea id="input" rows="8" spellcheck="false"></textarea>
        </div>

        <div class="card">
            <div class="card-header">
                <span>Output</span>
                <span class="spacer"></span>
                <button id="copy" class="small">Copy</button>
            </div>
            <div class="card-body">
                <div id="output" class="tool-output"></div>
            </div>
        </div>
    </main>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <footer>
        <a href="index.html">tools.julianwyngaard.dev</a> |
        <a href="https://github.com/julianwyngaard/logitrade-html-tools">Source</a>
    </footer>

    <script>
        // ABOUTME: Canonical skeleton for a tools.julianwyngaard.dev tool — copy this file to
        // ABOUTME: [slug].html and replace the placeholders; the chrome below is the reference.

        const STORAGE_KEY = '[slug]-state';
        const MAX_URL_LENGTH = 1500;
        const SAMPLE = 'Hello, World!';

        const els = {
            input: document.getElementById('input'),
            output: document.getElementById('output'),
            status: document.getElementById('status')
        };

        // ---- Status ----------------------------------------------------------
        let statusTimer = null;

        function showStatus(message, type) {
            clearTimeout(statusTimer);
            els.status.textContent = message;
            els.status.className = 'status ' + (type || 'info');
            // Errors stay up; everything else clears itself.
            if (type !== 'error') {
                statusTimer = setTimeout(() => {
                    els.status.textContent = '';
                    els.status.className = 'status';
                }, 3000);
            }
        }

        // ---- Clipboard -------------------------------------------------------
        function copyText(text) {
            if (!text) {
                showStatus('Nothing to copy', 'info');
                return;
            }
            navigator.clipboard.writeText(text)
                .then(() => showStatus('Copied to clipboard', 'success'))
                // Never claim success we cannot confirm.
                .catch(() => showStatus('Copy failed — select and copy manually', 'error'));
        }

        // ---- URL state -------------------------------------------------------
        function buildQuery() {
            const params = new URLSearchParams();
            const value = els.input.value;
            if (value) params.set('input', value);
            return params.toString();
        }

        function shareURL() {
            const qs = buildQuery();
            if (!qs) {
                showStatus('Nothing to share', 'info');
                return;
            }
            if (qs.length > MAX_URL_LENGTH) {
                showStatus('URL too long to share', 'error');
                return;
            }
            const url = location.origin + location.pathname + '?' + qs;
            history.replaceState({}, '', '?' + qs);
            navigator.clipboard.writeText(url)
                .then(() => showStatus('URL copied to clipboard', 'success'))
                .catch(() => showStatus('URL updated — copy from address bar', 'info'));
        }

        // ---- Persistence -----------------------------------------------------
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ input: els.input.value }));
            } catch (e) { /* private browsing, quota — not worth reporting */ }
        }

        function loadState() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
            } catch (e) {
                return null;
            }
        }

        function clearAll() {
            els.input.value = '';
            els.output.textContent = '';
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            history.replaceState({}, '', location.pathname);
            showStatus('Cleared', 'success');
        }

        // ---- The tool itself -------------------------------------------------
        function run() {
            // Replace with the real work.
            els.output.textContent = els.input.value.toUpperCase();
            saveState();
        }

        // ---- Init ------------------------------------------------------------
        function init() {
            const param = new URLSearchParams(location.search).get('input');
            // Precedence: URL param, then localStorage, then the sample.
            if (typeof param === 'string' && param.length <= MAX_URL_LENGTH) {
                els.input.value = param;
                run();
                showStatus('Loaded from URL', 'info');
            } else {
                const saved = loadState();
                els.input.value = saved && typeof saved.input === 'string' ? saved.input : SAMPLE;
                run();
            }

            document.getElementById('run').addEventListener('click', run);
            document.getElementById('share').addEventListener('click', shareURL);
            document.getElementById('clear').addEventListener('click', clearAll);
            document.getElementById('copy').addEventListener('click', () => copyText(els.output.textContent));
            els.input.addEventListener('input', run);
        }

        init();
    </script>
</body>
</html>
